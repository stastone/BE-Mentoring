services:
  app:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    environment:
      TZ: "Lithuania/Vilnius"
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network

  backend:
    build:
      context: .
      dockerfile: .Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      TZ: "Lithuania/Vilnius"
      REDIS_URL: "redis://redis:6379"
    expose:
      - "3000"
    networks:
      - proxy-network
    depends_on:
      - app
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
